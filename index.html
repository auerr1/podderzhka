<!doctype html>
<html lang="ru" class="h-full">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Слова поддержки для тебя</title>
        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Google Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />
        <!-- FontAwesome Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <style>
            body {
                font-family: "Plus Jakarta Sans", sans-serif;
            }
            .font-serif-custom {
                font-family: "Playfair Display", serif;
            }
            /* Background floating elements animation */
            @keyframes float-slow {
                0%,
                100% {
                    transform: translateY(0px) scale(1);
                }
                50% {
                    transform: translateY(-20px) scale(1.05);
                }
            }
            .animate-float-slow {
                animation: float-slow 8s ease-in-out infinite;
            }
            .animate-float-delayed {
                animation: float-slow 10s ease-in-out infinite 3s;
            }
            /* Custom smooth card transitions */
            .slide-transition {
                transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }
        </style>
    </head>
    <body
        class="h-full bg-gradient-to-br from-rose-50 via-purple-50 to-amber-50 text-slate-700 flex flex-col justify-between items-center p-4 sm:p-6 md:p-8 relative overflow-x-hidden min-h-screen"
    >
        <!-- Background glowing orbs & particles -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
            <div
                class="absolute top-10 left-10 w-72 h-72 bg-rose-200/40 rounded-full blur-3xl animate-float-slow"
            ></div>
            <div
                class="absolute bottom-10 right-10 w-96 h-96 bg-purple-200/40 rounded-full blur-3xl animate-float-delayed"
            ></div>
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-amber-100/30 rounded-full blur-3xl"
            ></div>
        </div>

        <!-- Top Header -->
        <header class="relative z-10 w-full max-w-2xl flex justify-between items-center py-2 px-2">
            <div class="flex items-center gap-2 text-rose-500 font-medium text-sm">
                <i class="fa-solid fa-heart animate-pulse"></i>
                <span>Для тебя</span>
            </div>
            <div
                id="slideCounter"
                class="text-xs font-semibold tracking-wider uppercase text-slate-400 bg-white/60 px-3 py-1 rounded-full backdrop-blur-sm border border-slate-200/50 shadow-sm"
            >
                Слайд 1 из 4
            </div>
        </header>

        <!-- Main Slider Container -->
        <main class="relative z-10 w-full max-w-2xl my-auto py-4">
            <div
                class="relative bg-white/80 backdrop-blur-xl border border-white/60 shadow-2xl rounded-3xl p-6 sm:p-8 md:p-10 min-h-[420px] sm:min-h-[460px] flex flex-col justify-between slide-transition"
            >
                <!-- Decorative icon badge -->
                <div
                    class="absolute -top-6 left-1/2 -translate-x-1/2 w-12 h-12 bg-gradient-to-tr from-rose-400 to-pink-500 rounded-2xl shadow-lg shadow-rose-500/30 flex items-center justify-center text-white text-lg"
                >
                    <i id="badgeIcon" class="fa-solid fa-hand-holding-heart"></i>
                </div>

                <!-- Slide Content Area -->
                <div id="slideContent" class="mt-4 flex-grow flex items-center justify-center text-center">
                    <!-- Content will be injected dynamically via JavaScript -->
                </div>

                <!-- Slide Indicators (Dots) -->
                <div class="flex justify-center items-center gap-2 mt-6 pt-4 border-t border-slate-100">
                    <button
                        onclick="goToSlide(0)"
                        class="dot w-3 h-3 rounded-full transition-all duration-300 bg-rose-500 cursor-pointer"
                        aria-label="Слайд 1"
                    ></button>
                    <button
                        onclick="goToSlide(1)"
                        class="dot w-3 h-3 rounded-full transition-all duration-300 bg-slate-200 hover:bg-slate-300 cursor-pointer"
                        aria-label="Слайд 2"
                    ></button>
                    <button
                        onclick="goToSlide(2)"
                        class="dot w-3 h-3 rounded-full transition-all duration-300 bg-slate-200 hover:bg-slate-300 cursor-pointer"
                        aria-label="Слайд 3"
                    ></button>
                    <button
                        onclick="goToSlide(3)"
                        class="dot w-3 h-3 rounded-full transition-all duration-300 bg-slate-200 hover:bg-slate-300 cursor-pointer"
                        aria-label="Слайд 4"
                    ></button>
                </div>
            </div>

            <!-- Navigation Buttons Bar -->
            <div class="flex justify-between items-center mt-6 px-2">
                <button
                    id="prevBtn"
                    onclick="prevSlide()"
                    class="bg-white/70 hover:bg-white text-slate-600 hover:text-slate-900 px-5 py-2.5 rounded-2xl font-medium text-sm backdrop-blur-md border border-slate-200/60 shadow-sm transition-all flex items-center gap-2 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed"
                >
                    <i class="fa-solid fa-arrow-left text-xs"></i> Назад
                </button>
                <button
                    id="nextBtn"
                    onclick="nextSlide()"
                    class="bg-rose-500 hover:bg-rose-600 text-white px-6 py-2.5 rounded-2xl font-medium text-sm shadow-md shadow-rose-500/20 transition-all flex items-center gap-2 cursor-pointer"
                >
                    <span>Далее</span> <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="relative z-10 text-xs text-slate-400 text-center py-2">
            Сделано с любовью и заботой для тебя ❤️
        </footer>

        <script>
            // Slides text, icons and cat images data
            const slides = [
                {
                    text: "«Сейчас идет трудный этап в твоей жизни. Это очень тяжело, я знаю. Пусть за последнее время и стало легче, но это все еще тяжелая ноша для тебя, и я понимаю это. Я хочу чтобы ты знала, что пройдет время и все наладиться. Все проблемы временны и их можно решить. И если тебе трудно справляться со всем этим самой, рядом с тобой всегда есть я.»",
                    icon: "fa-hand-holding-heart",
                    image: "https://i.pinimg.com/736x/b9/68/79/b96879b07591410fa613ce6ff6f623c6.jpg",
                },
                {
                    text: "«Как бы трудно ни было, будь у нас недопонимания или все хорошо в отношениях. Будь сейчас легкий момент или трудный, хороший или плохой. Несмотря ни на что, ни на какие невзгоды, трудности или, может, даже обиды, я всегда буду рядом с тобой - всегда буду рядом морально и физически, всегда поддержу тебя и помогу тебе в трудный момент. Неважно, деньгами или словами поддержки, действиями или объятиями, я всегда помогу всем, чем смогу, что будет в моих силах. И даже если в какие-то моменты тебе хочется побыть одной, я всё равно всегда рядом, готовый в любой момент поддержать тебя.»",
                    icon: "fa-shield-heart",
                    image: "https://i.pinimg.com/736x/7a/97/cd/7a97cdc150eac0a0fca25d2f2110c87c.jpg",
                },
                {
                    text: "«Ты тот человек, который своим присутствием в моей жизни делает меня лучше. Ты меняешь меня в лучшую сторону и показываешь мне пример, как можно не сдаваться несмотря ни на что, оставаться сильным и быть добрым к близким тебе людям. Благодаря тебе я стал только лучше, надеюсь, что ты и дальше будешь рядом со мной. А я в свою очередь буду стараться делать всё для того, чтобы ты становилась лучше и тебе было легче, и обещаю всегда быть рядом с тобой.»",
                    icon: "fa-seedling",
                    image: "https://i.pinimg.com/736x/06/fa/2d/06fa2d379c8f74775a6a6ab16954f871.jpg",
                },
                {
                    text: "«Я люблю тебя очень сильно!»",
                    icon: "fa-heart",
                    image: "https://i.pinimg.com/1200x/3e/27/ac/3e27acf947e58b9383afa00c526bd2f6.jpg",
                },
            ];

            let currentSlide = 0;

            // DOM elements
            const slideContent = document.getElementById("slideContent");
            const slideCounter = document.getElementById("slideCounter");
            const badgeIcon = document.getElementById("badgeIcon");
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const dots = document.querySelectorAll(".dot");

            // Render current slide
            function renderSlide() {
                // Fade out effect
                slideContent.style.opacity = "0";
                slideContent.style.transform = "translateY(10px)";

                setTimeout(() => {
                    const current = slides[currentSlide];

                    if (currentSlide === 3) {
                        // Final love declaration slide with centered cat image
                        slideContent.innerHTML = `
                        <div class="flex flex-col items-center justify-center w-full py-2">
                            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl overflow-hidden shadow-md mb-4 border-2 border-rose-200">
                                <img src="${current.image}" alt="Милый котик" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150/ffe4e6/e11d48?text=❤️'">
                            </div>
                            <h2 class="font-serif-custom text-3xl sm:text-4xl md:text-5xl font-semibold text-rose-600 leading-tight">
                                ${current.text}
                            </h2>
                        </div>
                    `;
                    } else {
                        // Regular slides with image alongside text layout
                        slideContent.innerHTML = `
                        <div class="flex flex-col md:flex-row items-center gap-4 sm:gap-6 text-left w-full my-2">
                            <div class="w-24 h-24 sm:w-32 sm:h-32 flex-shrink-0 rounded-2xl overflow-hidden shadow-md border-2 border-rose-100">
                                <img src="${current.image}" alt="Милый котик" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/150x150/ffe4e6/e11d48?text=🐱'">
                            </div>
                            <div class="flex-grow">
                                <p class="text-slate-600 text-sm sm:text-base md:text-lg font-light leading-relaxed">
                                    ${current.text}
                                </p>
                            </div>
                        </div>
                    `;
                    }

                    // Update badge icon
                    badgeIcon.className = `fa-solid ${current.icon}`;

                    // Update counter
                    slideCounter.innerText = `Слайд ${currentSlide + 1} из ${slides.length}`;

                    // Update navigation state
                    prevBtn.disabled = currentSlide === 0;
                    if (currentSlide === slides.length - 1) {
                        nextBtn.innerHTML = `<span>Сначала</span> <i class="fa-solid fa-rotate-right text-xs"></i>`;
                    } else {
                        nextBtn.innerHTML = `<span>Далее</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
                    }

                    // Update dots
                    dots.forEach((dot, index) => {
                        if (index === currentSlide) {
                            dot.className =
                                "dot w-6 h-3 rounded-full transition-all duration-300 bg-rose-500 cursor-pointer";
                        } else {
                            dot.className =
                                "dot w-3 h-3 rounded-full transition-all duration-300 bg-slate-200 hover:bg-slate-300 cursor-pointer";
                        }
                    });

                    // Fade in effect
                    slideContent.style.opacity = "1";
                    slideContent.style.transform = "translateY(0)";
                }, 200);
            }

            // Navigation functions
            function nextSlide() {
                currentSlide++;
                if (currentSlide >= slides.length) {
                    currentSlide = 0; // Loop back to start
                }
                renderSlide();
            }

            function prevSlide() {
                if (currentSlide > 0) {
                    currentSlide--;
                    renderSlide();
                }
            }

            function goToSlide(index) {
                currentSlide = index;
                renderSlide();
            }

            // Keyboard navigation (Arrow keys)
            document.addEventListener("keydown", e => {
                if (e.key === "ArrowRight" || e.key === " ") {
                    nextSlide();
                } else if (e.key === "ArrowLeft") {
                    prevSlide();
                }
            });

            // Touch swipe support for mobile devices
            let touchStartX = 0;
            let touchEndX = 0;

            document.addEventListener("touchstart", e => {
                touchStartX = e.changedTouches[0].screenX;
            });

            document.addEventListener("touchend", e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                if (touchEndX < touchStartX - swipeThreshold) {
                    nextSlide();
                }
                if (touchEndX > touchStartX + swipeThreshold) {
                    prevSlide();
                }
            }

            // Initial render on load
            window.addEventListener("DOMContentLoaded", () => {
                slideContent.style.transition = "all 0.3s ease";
                renderSlide();
            });
        </script>
    </body>
</html>
